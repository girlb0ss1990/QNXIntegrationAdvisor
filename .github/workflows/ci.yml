name: ci

# No QNX SDP is available (or redistributable) in CI. CI covers the deterministic host
# tool; qcc builds run locally with `make qnx-check` and are logged in docs/qnx-check-log.txt.
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check advisor tests eval scripts
      - run: pytest -q
      - run: python eval/score.py
      - name: Scan the samples (deterministic mode, SARIF, unverified against sysroot)
        run: qnx-advisor scan samples/motor-pid-controller --format sarif --out advisor.sarif --no-qcc
      - uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'push'
        with:
          sarif_file: advisor.sarif
          category: qnx-integration-advisor

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
