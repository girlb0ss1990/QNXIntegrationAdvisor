[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnx-integration-advisor"
version = "0.1.0"
description = "Local-first advisor that audits Linux/POSIX C/C++ repos against your QNX SDP 8.0 sysroot and generates a qcc-verified porting kit"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "tree-sitter==0.21.3",
  "tree-sitter-languages==1.10.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
qnx-advisor = "advisor.cli:main"

[tool.setuptools.packages.find]
include = ["advisor*"]

[tool.setuptools.package-data]
advisor = ["rules/*.yaml", "kit/templates/*.j2", "synth/prompts/*.md", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["advisor", "conftest"]
